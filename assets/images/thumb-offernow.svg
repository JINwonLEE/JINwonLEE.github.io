<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">OfferNow</title>
  <desc id="desc">Conceptual workflow from an uploaded CV to an evidence-linked profile and official job postings matched with CV evidence.</desc>
  <rect width="800" height="500" fill="#191c20"/>
  <g font-family="Arial, sans-serif">
    <text x="44" y="70" fill="#f7f9f8" font-size="30" font-weight="700">OfferNow</text>
    <text x="44" y="104" fill="#b8c6c0" font-size="17">CV upload / Evidence profile / Official job matches</text>
    <g fill="#23282d" stroke-width="2">
      <rect x="44" y="174" width="212" height="160" rx="8" stroke="#d95f45"/>
      <rect x="294" y="174" width="212" height="160" rx="8" stroke="#67c7e8"/>
      <rect x="544" y="174" width="212" height="160" rx="8" stroke="#70d79e"/>
    </g>
    <g fill="none" stroke="#9caba4" stroke-width="2">
      <path d="M256 254h30m-8-7 8 7-8 7M506 254h30m-8-7 8 7-8 7"/>
    </g>
    <text x="150" y="214" text-anchor="middle" dominant-baseline="central" fill="#e88069" font-size="14" font-weight="700">01 / UPLOAD</text>
    <text x="400" y="214" text-anchor="middle" dominant-baseline="central" fill="#67c7e8" font-size="14" font-weight="700">02 / STRUCTURE</text>
    <text x="650" y="214" text-anchor="middle" dominant-baseline="central" fill="#70d79e" font-size="14" font-weight="700">03 / MATCH</text>
    <g fill="#f7f9f8" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central">
      <text x="150" y="254">CV PDF/DOCX</text>
      <text x="400" y="254">Career profile</text>
      <text x="650" y="254">Job matches</text>
    </g>
    <g fill="#b8c6c0" font-size="16" text-anchor="middle" dominant-baseline="central">
      <text x="150" y="294">No sign-up needed</text>
      <text x="400" y="294">Evidence-linked</text>
      <text x="650" y="294">Official postings</text>
    </g>
    <path d="M44 378h712" stroke="#39453e"/>
    <text x="44" y="416" fill="#d9e3de" font-size="18">Every match shows posting requirements next to CV evidence</text>
    <text x="44" y="449" fill="#9caba4" font-size="15">Personal project · Expo, FastAPI, PostgreSQL, LLM</text>
  </g>
</svg>
